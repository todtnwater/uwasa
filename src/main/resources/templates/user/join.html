<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>회원가입 - うわさ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="logo"><a th:href="@{/}">うわさ</a></div>
        <div class="header-right">
            <button class="theme-btn" onclick="toggleTheme()">🌙</button>
			<th:block th:if="${#authentication == null or #authentication.name == 'anonymousUser'}">
				            <a th:href="@{/user/login}" class="btn btn-outline">로그인</a>
				            <a th:href="@{/user/join}" class="btn">회원가입</a>
				        </th:block>
				        <th:block th:if="${#authentication != null and #authentication.name != 'anonymousUser'}">
				            <a th:href="@{/user/mypage}" class="btn btn-outline">마이페이지</a>
				            <a th:href="@{/user/logout}" class="btn">로그아웃</a>
				        </th:block>
        </div>
    </header>

    <main>
        <div class="form-wrap">
            <h2 class="form-title">회원가입</h2>

            <div th:if="${error}" class="error-msg" th:text="${error}"></div>

            <form th:action="@{/user/join}" method="post" onsubmit="return checkTerms()">
                <div class="form-group">
                    <label>아이디</label>
                    <input type="text" name="username" placeholder="아이디" maxlength="50" required>
                </div>
                <div class="form-group">
                    <label>비밀번호</label>
                    <input type="password" name="password" placeholder="비밀번호" maxlength="255" required>
                </div>
                <div class="form-group">
                    <label>닉네임</label>
                    <input type="text" name="nickname" placeholder="닉네임" maxlength="50" required>
                </div>

                <div class="terms-wrap">
                    <div class="terms-check">
                        <input type="checkbox" id="termsAgree">
                        <label for="termsAgree">
                            <a th:href="@{/terms}" target="_blank">이용약관</a> 및
                            <a th:href="@{/privacy}" target="_blank">개인정보처리방침</a>에 동의합니다.
                        </label>
                    </div>
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn">가입하기</button>
                </div>
            </form>

            <div class="form-link">
                이미 계정이 있으신가요? <a th:href="@{/user/login}">로그인</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a th:href="@{/terms}">이용약관</a>
            <a th:href="@{/privacy}">개인정보처리방침</a>
			<a th:href="@{/inquiry/write}">문의하기</a>
        </div>
        <div class="footer-copy">© 2026 うわさ</div>
    </footer>

    <script th:src="@{/js/main.js}"></script>
    <script>
        function checkTerms() {
            if (!document.getElementById('termsAgree').checked) {
                alert('이용약관 및 개인정보처리방침에 동의해주세요.');
                return false;
            }
            return true;
        }
    </script>
</body>
</html>

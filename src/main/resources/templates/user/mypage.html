<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>마이페이지 - うわさ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="logo"><a th:href="@{/}">うわさ</a></div>
        <div class="header-right">
            <button class="theme-btn" onclick="toggleTheme()">🌙</button>
            <th:block th:if="${user.role == 'ADMIN'}">
                <a th:href="@{/admin/dashboard}" class="btn btn-outline">🔒 관리자</a>
            </th:block>
            <a th:href="@{/user/logout}" class="btn">로그아웃</a>
        </div>
    </header>

    <main>
        <div class="mypage-wrap">
            <div class="user-info">
                <h2 th:text="${user.nickname}">닉네임</h2>
                <div class="user-stats">
                    <div class="stat-item">
                        <span class="stat-label">만족도</span>
                        <span class="stat-value" th:text="${user.satisfaction}">0</span>
                    </div>
                    <div class="stat-item">
                        <span class="stat-label">포인트</span>
                        <span class="stat-value" th:text="${user.points}">0</span>
                    </div>
                </div>
            </div>

            <div th:if="${error}" class="error-msg" th:text="${error}"></div>
            <div th:if="${readerNickname}" class="success-msg">
                열람자: <strong th:text="${readerNickname}">닉네임</strong>
            </div>

            <h3 class="section-title">내가 남긴 소문</h3>

            <div th:if="${myPosts.isEmpty()}" class="empty-msg">
                아직 남긴 소문이 없습니다.
            </div>

            <div th:each="post : ${myPosts.content}" class="my-post-card">
                <div class="my-post-header">
                    <span th:text="${#temporals.format(post.createdAt, 'MM/dd HH:mm')}">시간</span>
                    <span th:if="${post.isConsumed == 0}" class="badge-alive">생존중</span>
                    <span th:if="${post.isConsumed == 1}" class="badge-consumed">소멸됨</span>
                </div>
                <div class="my-post-title" th:text="${post.title}">제목</div>
                <div th:if="${post.isConsumed == 1}" class="reveal-wrap">
                    <form th:action="@{/user/revealReader}" method="post">
                        <input type="hidden" name="postId" th:value="${post.postId}">
                        <input type="hidden" name="page" th:value="${currentPage}">
                        <button type="submit" class="btn btn-outline">👁️ 열람자 확인 (10포인트)</button>
                    </form>
                </div>
            </div>

            <!-- 페이지네이션 -->
            <div class="pagination-wrap">
                <a th:if="${currentPage > 0}"
                   th:href="@{/user/mypage(page=${currentPage - 1})}"
                   class="btn btn-outline">▲</a>
                <span th:text="${currentPage + 1} + ' / ' + ${myPosts.totalPages}">1 / 1</span>
                <a th:if="${currentPage + 1 < myPosts.totalPages}"
                   th:href="@{/user/mypage(page=${currentPage + 1})}"
                   class="btn btn-outline">▼</a>
            </div>

            <div style="margin-top: 1.5rem; text-align: center;">
                <a th:href="@{/inquiry/list}" class="btn btn-outline">📬 내 문의 목록</a>
                <a th:href="@{/inquiry/write}" class="btn" style="margin-left: 0.5rem;">✏️ 문의하기</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a th:href="@{/terms}">이용약관</a>
            <a th:href="@{/privacy}">개인정보처리방침</a>
            <a th:href="@{/inquiry/write}">문의하기</a>
        </div>
        <div class="footer-copy">© 2026 うわさ</div>
    </footer>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>

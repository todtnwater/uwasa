<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>うわさ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
	<header>
	     <div class="logo"><a th:href="@{/}">うわさ</a></div>
	    <div class="header-right">
	        <button class="theme-btn" onclick="toggleTheme()">🌙</button>
	        <th:block th:if="${#authentication == null or #authentication.name == 'anonymousUser'}">
	            <a th:href="@{/user/login}" class="btn btn-outline">로그인</a>
	            <a th:href="@{/user/join}" class="btn">회원가입</a>
	        </th:block>
	        <th:block th:if="${#authentication != null and #authentication.name != 'anonymousUser'}">
	            <a th:href="@{/user/mypage}" class="btn btn-outline">마이페이지</a>
	            <a th:href="@{/user/logout}" class="btn">로그아웃</a>
	        </th:block>
	    </div>
	</header>

    <div class="banner">
        <div class="banner-item">
            👻 오늘 사라진 소문 <span th:text="${countConsumedToday}">0</span>개
        </div>
        <div class="banner-item">
            📜 지금 남은 소문 <span th:text="${countAlive}">0</span>개
        </div>
        <div class="banner-item">
            💀 누적 소멸 <span th:text="${countTotalConsumed}">0</span>개
        </div>
    </div>

    <main>
        <div class="write-btn-wrap">
            <a th:href="@{/post/write}" class="btn">✏️ 소문 남기기</a>
        </div>

        <div class="post-list" id="postList">
            <div th:each="post : ${posts}" class="post-card" th:attr="data-id=${post.postId}">
                <div class="post-header">
                    <span class="post-nickname" th:text="${post.writerNickname}">닉네임</span>
                    <span class="post-time" th:text="${#temporals.format(post.createdAt, 'MM/dd HH:mm')}">시간</span>
                </div>
                <div class="post-title" th:text="${post.title}">제목</div>
                <div class="post-footer">
					<form th:action="@{/post/read/{id}(id=${post.postId})}" method="post">
					    <button type="submit" class="read-btn">👁️ 읽기 (소멸됩니다)</button>
					</form>
                </div>
            </div>

            <div th:if="${#lists.isEmpty(posts)}" class="empty-msg">
                아직 소문이 없습니다. 첫 번째 소문을 남겨보세요!
            </div>
        </div>
    </main>
	<footer>
	      <div class="footer-links">
	          <a th:href="@{/terms}">이용약관</a>
	          <a th:href="@{/privacy}">개인정보처리방침</a>
			  <a th:href="@{/inquiry/write}">문의하기</a>
	      </div>
	      <div class="footer-copy">© 2026 todtnwater うわさ</div>
	  </footer>
    <script th:src="@{/js/main.js}"></script>
</body>
</html>

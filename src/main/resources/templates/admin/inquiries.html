<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>문의 관리 - うわさ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="logo"><a th:href="@{/}">うわさ</a></div>
        <div class="header-right">
            <button class="theme-btn" onclick="toggleTheme()">🌙</button>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline">대시보드</a>
            <a th:href="@{/admin/reports}" class="btn btn-outline">🚨 신고</a>
            <a th:href="@{/user/logout}" class="btn">로그아웃</a>
        </div>
    </header>

    <main>
        <div class="admin-wrap">
            <h2 class="section-title">📬 문의 관리</h2>

            <div th:if="${inquiries.isEmpty()}" class="empty-msg">
                문의 내역이 없습니다.
            </div>

            <div th:each="inquiry : ${inquiries.content}" class="ban-card">
                <div class="ban-info">
                    <span class="ban-ip" th:text="${inquiry.title}">제목</span>
                    <span class="ban-reason" th:text="${inquiry.nickname + ' · ' + #temporals.format(inquiry.createdAt, 'MM/dd HH:mm')}">닉네임 · 시간</span>
                    <span class="ban-reason" th:text="${inquiry.content}">내용</span>
                    <span th:if="${inquiry.isAnswered == 0}" class="badge-alive">답변 대기</span>
                    <span th:if="${inquiry.isAnswered == 1}" class="badge-consumed">답변 완료</span>
                </div>
                <div th:if="${inquiry.isAnswered == 0}">
                    <form th:action="@{/admin/answer}" method="post">
                        <input type="hidden" name="inquiryId" th:value="${inquiry.inquiryId}">
                        <div class="form-group" style="margin-bottom: 0.5rem;">
                            <textarea name="answer" placeholder="답변 내용 입력" rows="3"
                                style="width:100%; padding:0.5rem; border:1px solid var(--border);
                                       background:var(--input-bg); color:var(--text); border-radius:4px;
                                       font-family:inherit;" required></textarea>
                        </div>
                        <button type="submit" class="btn">답변 등록</button>
                    </form>
                </div>
                <div th:if="${inquiry.isAnswered == 1}" class="ban-info">
                    <span style="color: var(--sub-text); font-size: 0.85rem;">답변: </span>
                    <span class="ban-reason" th:text="${inquiry.answer}">답변내용</span>
                </div>
            </div>

            <!-- 페이지네이션 -->
            <div class="pagination-wrap">
                <a th:if="${currentPage > 0}"
                   th:href="@{/admin/inquiries(page=${currentPage - 1})}"
                   class="btn btn-outline">▲</a>
                <span th:text="${currentPage + 1} + ' / ' + ${inquiries.totalPages}">1 / 1</span>
                <a th:if="${currentPage + 1 < inquiries.totalPages}"
                   th:href="@{/admin/inquiries(page=${currentPage + 1})}"
                   class="btn btn-outline">▼</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a th:href="@{/terms}">이용약관</a>
            <a th:href="@{/privacy}">개인정보처리방침</a>
            <a th:href="@{/inquiry/write}">문의하기</a>
        </div>
        <div class="footer-copy">© 2026 todtnwater うわさ</div>
    </footer>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>

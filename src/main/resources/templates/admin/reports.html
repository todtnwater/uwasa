<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>신고 관리 - うわさ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="logo"><a th:href="@{/}">うわさ</a></div>
        <div class="header-right">
            <button class="theme-btn" onclick="toggleTheme()">🌙</button>
            <a th:href="@{/admin/dashboard}" class="btn btn-outline">대시보드</a>
            <a th:href="@{/admin/inquiries}" class="btn btn-outline">📬 문의</a>
            <a th:href="@{/user/logout}" class="btn">로그아웃</a>
        </div>
    </header>

    <main>
        <div class="admin-wrap">
            <h2 class="section-title">🚨 신고 목록</h2>

            <div th:if="${reports.isEmpty()}" class="empty-msg">
                신고 내역이 없습니다.
            </div>

            <div th:each="report : ${reports.content}" class="ban-card">
                <div class="ban-info">
                    <span class="ban-ip" th:text="'IP: ' + ${report.ip}">IP</span>
                    <span class="ban-reason" th:text="'사유: ' + ${report.reportReason != null ? report.reportReason : '사유 없음'}">사유</span>
                    <span class="ban-expired" th:text="'신고 시간: ' + ${#temporals.format(report.createdAt, 'MM/dd HH:mm')}">시간</span>
                </div>
                <form th:action="@{/admin/ban}" method="post">
                    <input type="hidden" name="ip" th:value="${report.ip}">
                    <input type="hidden" name="reason" th:value="${report.reportReason != null ? report.reportReason : ''}">
                    <button type="submit" class="btn">IP 밴</button>
                </form>
            </div>

            <!-- 페이지네이션 -->
            <div class="pagination-wrap">
                <a th:if="${currentPage > 0}"
                   th:href="@{/admin/reports(page=${currentPage - 1})}"
                   class="btn btn-outline">▲</a>
                <span th:text="${currentPage + 1} + ' / ' + ${reports.totalPages}">1 / 1</span>
                <a th:if="${currentPage + 1 < reports.totalPages}"
                   th:href="@{/admin/reports(page=${currentPage + 1})}"
                   class="btn btn-outline">▼</a>
            </div>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a th:href="@{/terms}">이용약관</a>
            <a th:href="@{/privacy}">개인정보처리방침</a>
            <a th:href="@{/inquiry/write}">문의하기</a>
        </div>
        <div class="footer-copy">© 2026 todtnwater うわさ</div>
    </footer>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>

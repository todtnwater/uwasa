<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>소문 남기기 - うわさ</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header>
        <div class="logo"><a th:href="@{/}">うわさ</a></div>
        <div class="header-right">
            <button class="theme-btn" onclick="toggleTheme()">🌙</button>
			<th:block th:if="${#authentication == null or #authentication.name == 'anonymousUser'}">
				            <a th:href="@{/user/login}" class="btn btn-outline">로그인</a>
				            <a th:href="@{/user/join}" class="btn">회원가입</a>
				        </th:block>
				        <th:block th:if="${#authentication != null and #authentication.name != 'anonymousUser'}">
				            <a th:href="@{/user/mypage}" class="btn btn-outline">마이페이지</a>
				            <a th:href="@{/user/logout}" class="btn">로그아웃</a>
				        </th:block>
        </div>
    </header>

    <main>
        <div class="form-wrap">
            <h2 class="form-title">✏️ 소문 남기기</h2>
            <p class="form-desc">누군가 읽는 순간, 이 소문은 사라집니다.</p>

			<div th:if="${param.badword}" class="error-msg">
			    금칙어가 포함된 내용은 작성할 수 없습니다.
			</div>
			<div th:if="${param.cooldown}" class="error-msg">
			    ⏳ 10초 후 다시 작성할 수 있습니다.
			</div>
            <form th:action="@{/post/write}" method="post" onsubmit="disableSubmit(this)">
                <div class="form-group">
                    <label>제목</label>
                    <input type="text" name="title" placeholder="제목을 입력하세요" maxlength="100" required>
                </div>
                <div class="form-group">
                    <label>내용</label>
                    <textarea name="content" placeholder="내용을 입력하세요" maxlength="4000" rows="8" required></textarea>
                </div>
                <div class="form-actions">
                    <a th:href="@{/}" class="btn btn-outline">취소</a>
                    <button type="submit" class="btn">소문 던지기</button>
                </div>
            </form>
        </div>
    </main>

    <footer>
        <div class="footer-links">
            <a th:href="@{/terms}">이용약관</a>
            <a th:href="@{/privacy}">개인정보처리방침</a>
			<a th:href="@{/inquiry/write}">문의하기</a>
        </div>
        <div class="footer-copy">© 2026 todtnwater うわさ</div>
    </footer>

    <script th:src="@{/js/main.js}"></script>
</body>
</html>
